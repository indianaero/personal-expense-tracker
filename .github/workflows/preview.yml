name: Preview Deployment

on:
  pull_request:
    branches:
      - '**'

concurrency:
  # Only one preview run per PR at a time.
  # If a developer pushes twice quickly, the first run is cancelled — the
  # second run will produce the correct preview from the latest commit.
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Lint · Build · Deploy Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Required to post the preview URL as a PR comment

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ─────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # ── Dependencies ─────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Lint ─────────────────────────────────────────────────────────────────
      # Broken code does not get a preview URL.
      - name: Lint
        run: npm run lint

      # ── Type-check ───────────────────────────────────────────────────────────
      # Catches TypeScript errors that eslint may not surface.
      - name: Type-check
        run: npx tsc --noEmit

      # ── Docker build verification ─────────────────────────────────────────
      # Build the Docker image to prove the Dockerfile and Next.js build are
      # healthy. The image is NOT pushed to any registry — Vercel handles its
      # own build pipeline. This step acts as an independent build gate.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (verify only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: expense-tracker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            git.sha=${{ github.sha }}
            git.ref=${{ github.ref }}

      # ── Vercel preview deployment ─────────────────────────────────────────
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for Vercel (preview)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$url" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── PR comment ───────────────────────────────────────────────────────────
      # Post the preview URL so reviewers can test without opening the Vercel
      # dashboard. The comment is posted on the PR, not the commit.
      - name: Post preview URL to PR
        uses: actions/github-script@v7
        with:
          script: |
            const url  = '${{ steps.deploy.outputs.preview_url }}';
            const sha  = context.sha.slice(0, 7);
            const body = [
              '### Preview deployment ready',
              '',
              `**URL:** ${url}`,
              `**Commit:** \`${sha}\``,
              '',
              '> This URL is overwritten on every new push to this PR.',
              '> It points to the **staging** database — not production.',
            ].join('\n');

            // Find an existing bot comment to update rather than posting a new
            // one on every push — keeps the PR thread clean.
            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('Preview deployment ready')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
